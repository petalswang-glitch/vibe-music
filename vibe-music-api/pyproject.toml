[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibe-music-api"
version = "0.1.0"
description = "Vibe Music FastAPI backend"
authors = [{ name = "petalswang-glitch" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "redis>=5.2,<8",
  "httpx>=0.28,<1",
  "minio>=7.2,<8",
  "anyio>=4,<5",
  "pyjwt>=2.10,<3",
  "argon2-cffi>=25,<26",
  "aiosmtplib>=4,<6",
  "email-validator>=2,<3",
  "pillow>=13.0.0",
  "python-multipart>=0.0.32",
  "mutagen>=1.47,<2",
  "langgraph>=1.1,<2",
  "langchain-openai>=1,<2",
  "cryptography>=50.0.2,<51",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a dedicated disposable PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
